<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>离线</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; background: #f5f1ea; color: #14161f; display: grid; place-items: center; min-height: 100vh; margin: 0; }
      main { text-align: center; padding: 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
      h1 { color: #c4553c; }
      p { opacity: .8; }
      @media (prefers-color-scheme: dark) {
        body { background: #14161f; color: #f2f3f7; }
        h1 { color: #e07a5f; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前离线</h1>
      <p>请联网查看订阅数据。离线不提供任何缓存数据。</p>
    </main>
  </body>
</html>
