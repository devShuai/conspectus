# 采集器发布到自有 registry（conspectus#126）。
#
# 触发：推送 `collector-v<版本>` tag，例如 `collector-v0.1.1`。
# 仅发布 collector/，与服务端版本无关 —— 两者节奏不同，共用一个 tag 只会逼着
# 没有改动的一方也升版本。
#
# 需要一个仓库 secret：NEXUS_NPM_TOKEN（Nexus 里为发布账号生成的 npm token）。
# registry 地址与 collector/package.json 的 publishConfig 必须一致。
#
# 前提：Nexus 必须启用 **npm Bearer Token Realm**（Administration → Security →
# Realms，默认关闭）。没启用时服务端只广告 Basic，本文件下发的 _authToken 会被拒，
# 表现为发布步骤 `npm error code E401 … need: BASIC realm="Sonatype Nexus …"`。
# 启用后用 `npm login --scope=@devshuai --registry=<上面的 NPM_REGISTRY>` 取
# NpmToken.* 填进 secret。若该部署无法改 realm，则要改用 HTTP Basic：把下面的
# `_authToken=` 换成 `_auth=`，secret 存 base64(用户名:密码)。两种写法不能混用。
name: collector-publish

on:
  push:
    tags:
      - "collector-v*"
  # 手动触发只跑到认证预检为止。排查发布权限时不必为了看一行输出就动一次 tag ——
  # tag 是发布的凭据，反复 force-push 会让「哪个提交发出去过」不再可信。
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_REGISTRY: https://nexus.devshuai.com/repository/npm-hosted/

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - run: npm ci

      # tag 与 package.json 必须一致，否则 tag 指向的代码和实际发布的版本会分叉，
      # 而 npm 一旦发出就无法原地更正。
      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: |
          tagged="${GITHUB_REF_NAME#collector-v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "tag collector-v$tagged 与 package.json 的 $declared 不一致" >&2
            exit 1
          fi

      - run: npm run build
      - run: npm test

      # 发布前先看一眼包里到底有什么：bin 入口 import 的是 dist/cli.js，而 dist/
      # 在 .gitignore 里 —— files 字段一旦被误删，发出去的就是个装得上、跑不了的包。
      - name: Verify the tarball carries the entry point
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          grep -q "dist/cli.js" /tmp/pack.txt || {
            echo "包内缺少 dist/cli.js，检查 package.json 的 files 字段" >&2
            exit 1
          }

      # 认证预检。npm publish 的 E401 只说「need: BASIC」，既不区分 token 缺失、
      # token 无效、还是 registry 与 .npmrc 的键对不上；而 npm publish --dry-run
      # 全程不联网，本地怎么验都验不到这一层。这里把三种情况分开报。
      - name: Verify registry auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NEXUS_NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "secret NEXUS_NPM_TOKEN 为空或未配置" >&2
            exit 1
          fi
          # 只报形态，不打印值：Nexus 的 npm bearer token 形如 NpmToken.<uuid>；
          # 若这里显示 base64/其他，多半是把 Basic 凭据填进了 bearer 位置。
          case "$NODE_AUTH_TOKEN" in
            NpmToken.*) echo "token 形态: NpmToken.*（Nexus npm bearer）" ;;
            *) echo "token 形态: 非 NpmToken.* 前缀" ;;
          esac
          # 指纹用于和本地可用的 token 对照，判断 secret 里存的是不是同一个值。
          # 只打印长度与 sha256 前 12 位，不可逆，也不会被日志掩码规则漏掉真值。
          echo "token 长度: ${#NODE_AUTH_TOKEN}"
          echo "token sha256 前 12 位: $(printf %s "$NODE_AUTH_TOKEN" | sha256sum | cut -c1-12)"

          registry_no_scheme="${NPM_REGISTRY#https:}"
          {
            echo "@devshuai:registry=${NPM_REGISTRY}"
            echo "${registry_no_scheme}:_authToken=\${NODE_AUTH_TOKEN}"
          } > .npmrc
          echo "写入的 .npmrc 认证键: ${registry_no_scheme}:_authToken"

          if ! whoami_out="$(npm whoami --registry="$NPM_REGISTRY" 2>&1)"; then
            echo "认证失败，registry 拒绝了这个 token：" >&2
            echo "$whoami_out" >&2
            echo "--- 依次排查：Nexus 是否启用 npm Bearer Token Realm；token 是否由" >&2
            echo "    npm login 对该 registry 生成；该账号是否有 npm-hosted 的写权限 ---" >&2
            exit 1
          fi
          # 该仓库开放匿名读，所以 whoami 成功并不代表认证生效 —— token 无效时它会
          # 以 anonymous 身份正常返回。不把这一种判为失败，预检就是假绿的。
          if [ -z "$whoami_out" ] || [ "$whoami_out" = "anonymous" ]; then
            echo "registry 以匿名身份接受了请求，token 并未生效（whoami=${whoami_out:-空}）" >&2
            echo "--- 多半是 secret 里存的不是 npm bearer token：Nexus 界面的 User Token" >&2
            echo "    是 Basic 凭据，放在 _authToken 位置会被当作无效 bearer 丢弃。" >&2
            echo "    正确取法：npm login --scope=@devshuai --registry=$NPM_REGISTRY" >&2
            echo "    取到的值形如 NpmToken.<uuid> ---" >&2
            exit 1
          fi
          echo "认证通过，身份: $whoami_out"

      # 只有 tag 推送才真正发布；手动触发到上一步的认证预检为止。
      - name: Publish
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NEXUS_NPM_TOKEN }}
        run: npm publish
