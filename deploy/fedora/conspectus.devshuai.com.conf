# OpenResty vhost，安装位置 /usr/local/openresty/nginx/conf/conf.d/
# 需要 root：release.sh 只把它放到 ~/.config/conspectus/ 下并提示，不代为写系统目录。
server {
    listen 80;
    server_name conspectus.devshuai.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name conspectus.devshuai.com;

    ssl_certificate     /usr/local/openresty/nginx/certs/devshuai.com.cert.pem;
    ssl_certificate_key /usr/local/openresty/nginx/certs/devshuai.com.key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    # 邮件导入的入站 webhook 会带原文，10m 与 certus 保持一致
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 写死 https 而非 $scheme：80 端口只做跳转，到这里的一律是 TLS 终结后的请求
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
